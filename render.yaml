services:
  - type: web
    name: agent-film-cost-optimizer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python web_app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
